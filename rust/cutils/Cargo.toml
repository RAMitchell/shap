[package]
name = "shap-rust-cutils"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_rust_cutils"
crate-type = ["cdylib"]

[dependencies]
numpy = "=0.29.0"
pyo3 = { version = "=0.29.3", features = ["abi3-py312"] }

[build-dependencies]
pyo3-build-config = "=0.29.3"

[profile.release]
strip = "symbols"
